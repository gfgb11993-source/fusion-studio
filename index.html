<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Fusion Studio v2</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#111318;color:#e7e8ef;overflow:hidden;height:100vh}
  .app{display:flex;flex-direction:column;height:100vh} .topbar{height:52px;display:flex;align-items:center;padding:0 16px;background:#17191f;border-bottom:1px solid #292c35;gap:14px;flex:none}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:1.5px;font-size:12px} .brand b{color:#a78bfa} .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:grid;place-items:center}
  .actions{margin-left:auto;display:flex;gap:6px} button{font:inherit;color:inherit;border:0;cursor:pointer;background:transparent} 
  .btn{padding:7px 12px;border-radius:6px;background:#232630;color:#c9cbd5;font-size:11px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#2e3140;color:#fff} .btn.primary{background:#7654d8;color:#fff} .btn:disabled{opacity:.35;cursor:not-allowed}
  .workspace{display:flex;flex:1;min-height:0} .toolbar{width:52px;background:#191b22;border-right:1px solid #292c35;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex:none}
  .tool{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:#8f92a0} .tool:hover{background:#292c37;color:#fff} .tool.active{background:#392e5e;color:#bda9ff;box-shadow:inset 0 0 0 1px #6650a8}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;background:#12141a} 
  .docbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#191b22;border-bottom:1px solid #292c35;font:10px 'Consolas',monospace;color:#858895}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background-color:#15171e;background-image:radial-gradient(#2c2f3a 1px,transparent 1px);background-size:18px 18px;padding:20px}
  .canvas-frame{box-shadow:0 15px 55px #0009;border:1px solid #3a3d49;background:#000;transform-origin:center center;transition:transform 0.1s} 
  canvas{display:block;max-width:100%;max-height:100%;cursor:crosshair}
  .right{width:260px;background:#191b22;border-left:1px solid #2b2e38;display:flex;flex-direction:column;overflow-y:auto;flex:none} 
  .section{padding:12px;border-bottom:1px solid #2b2e38}
  .heading{display:flex;justify-content:space-between;align-items:center;font:9px 'Consolas',monospace;letter-spacing:1px;color:#8d90a0;margin-bottom:8px}
  .layer{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:5px;color:#aeb0bb;font-size:11px;cursor:pointer} .layer:hover{background:#242731} .layer.selected{background:#302844;color:#e2d8ff}
  .label-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;color:#858895;font-size:10px}
  input[type=range]{width:100%;accent-color:#9b7af2} 
  input[type=number],select{width:100%;background:#232630;border:1px solid #30333e;color:#e7e8ef;padding:5px 7px;border-radius:5px;font:10px 'Consolas',monospace;outline:none}
  .num-input{width:56px;background:#232630;border:1px solid #30333e;color:#e7e8ef;padding:3px 6px;border-radius:4px;font:10px 'Consolas',monospace;outline:none;text-align:right}
  .status{height:22px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;background:#17191f;border-top:1px solid #292c35;font:9px 'Consolas',monospace;color:#777b88}
  .overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:100} .dialog{background:#1c1e26;border:1px solid #343745;border-radius:14px;padding:22px;width:560px;max-width:92vw;}
  .dialog h2{margin:0 0 4px;font-size:17px} .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .preset{background:#232630;border:1px solid #343745;border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px} .preset:hover{border-color:#7654d8;background:#2a2840} .preset b{font-size:11px} .preset span{font:9px 'Consolas',monospace;color:#8d90a0}
  .custom{display:flex;gap:6px;align-items:center;border-top:1px solid #2b2e38;padding-top:12px;font-size:11px;color:#8d90a0} .custom input{width:80px}
  .palette{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:90} .palette-box{background:#1c1e26;border:1px solid #343745;border-radius:12px;padding:16px;width:280px;text-align:center}
  .wheel-wrap{position:relative;width:220px;height:220px;margin:0 auto 10px} .wheel{width:220px;height:220px;border-radius:50%;cursor:crosshair;position:relative;box-shadow:0 0 0 2px #343745;background:radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%),conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .wheel-marker{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="mark">✦</div><span>FUSION <b>STUDIO</b></span></div>
    <div class="actions">
      <button class="btn" id="newBtn">Новый</button>
      <button class="btn primary" id="exportBtn">PNG</button>
    </div>
  </div>
  <div class="workspace">
    <div class="toolbar" id="toolbar"></div>
    <div class="center">
      <div class="docbar"><span id="sizeLabel">960 × 540</span><span id="zoomLabel">100%</span><span>Fusion Studio</span></div>
      <div class="stage" id="stage"><div class="canvas-frame" id="canvasFrame"><canvas id="cv" width="960" height="540"></canvas></div></div>
      <div class="status"><span>ГОТОВО</span><span id="toolLabel">Кисть</span></div>
    </div>
    <div class="right">
      <div class="section"><div class="heading">СЛОИ <button class="btn" id="addLayer" style="padding:2px 6px">+</button></div><div id="layersList"></div></div>
      <div class="section" id="propsPS">
        <div class="heading">СВОЙСТВА</div>
        <div class="label-row">Непрозрачность слоя <span><input type="number" class="num-input" id="opacityNum" min="0" max="100" value="100" /> %</span></div>
        <input type="range" id="opacityRange" min="0" max="100" value="100" />
        <div class="label-row">Кисть</div>
        <select id="brushType">
          <option value="soft">🖌 Мягкая</option>
          <option value="pencil">✏️ Карандаш</option>
          <option value="pen">🖊 Ручка</option>
          <option value="marker">🖍 Маркер</option>
          <option value="neon">✨ Неон</option>
          <option value="pixel">🟩 Пиксель</option>
        </select>
        <div class="label-row">Размер кисти <span><input type="number" class="num-input" id="brushNum" min="1" max="500" value="12" /> px</span></div>
        <input type="range" id="brushRange" min="1" max="500" value="12" />
        <div class="label-row">Цвет</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:5px">
          <button class="btn" id="openPaletteBtn" style="flex:1;justify-content:center;background:#232630">🎨 Палитра</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="newOverlay"><div class="dialog"><h2>Новый проект</h2><div class="presets" id="presets"></div><div class="custom"><span>Свой размер:</span><input type="number" id="customW" value="960" /><span>×</span><input type="number" id="customH" value="540" /><button class="btn primary" id="customCreate">Создать</button></div></div></div>

<!-- Круговая палитра -->
<div class="palette" id="paletteOverlay" style="display:none">
  <div class="palette-box">
    <div class="wheel-wrap"><div class="wheel" id="wheel"></div><div class="wheel-marker" id="wheelMarker" style="left:50%;top:50%;background:#a78bfa"></div></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <input type="color" id="colorPicker" value="#a78bfa" style="width:40px;height:30px;background:none;border:none;cursor:pointer">
      <span id="hexLabel" style="font:11px 'Consolas',monospace;color:#c9cbd5">#A78BFA</span>
    </div>
    <button class="btn primary" id="paletteDone" style="width:100%;justify-content:center">Готово</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'); const ctx = cv.getContext('2d'); const stage = document.getElementById('stage');
  let state = { tool: 'brush', brushSize: 12, brushType: 'soft', color: '#a78bfa', layers: [], activeId: null, drawing: false, prevMouse: null, zoom: 1 };

  const makeCanvas = (w,h) => { const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
  const mkLayer = (name,w,h) => ({ id: Date.now()+Math.random(), name, canvas: makeCanvas(w,h), visible: true, opacity: 1 });
  const getLayer = () => state.layers.find(l => l.id === state.activeId) || state.layers[0];

  const render = () => {
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle = '#20232c'; ctx.fillRect(0,0,cv.width,cv.height);
    for (const l of state.layers) { if (l.visible) { ctx.globalAlpha = l.opacity; ctx.drawImage(l.canvas, 0, 0); } }
    ctx.globalAlpha = 1;
  };

  const point = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) }; };

  // РИСОВАНИЕ
  cv.addEventListener('mousedown', e => {
    const p = point(e); const l = getLayer(); if (!l) return;
    if (state.tool === 'brush' || state.tool === 'eraser') { 
      state.drawing = true; state.prevMouse = p; draw(p, p); 
    }
    if (state.tool === 'fill') { floodFill(l, Math.floor(p.x), Math.floor(p.y), state.color); render(); }
    if (state.tool === 'picker') { 
      const d = ctx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
      state.color = '#' + [d[0],d[1],d[2]].map(v => v.toString(16).padStart(2,'0')).join('');
      document.getElementById('colorPicker').value = state.color;
      document.getElementById('hexLabel').textContent = state.color.toUpperCase();
    }
  });
  cv.addEventListener('mousemove', e => {
    const p = point(e);
    if (state.drawing && state.prevMouse) { draw(state.prevMouse, p); state.prevMouse = p; }
  });
  cv.addEventListener('mouseup', () => { state.drawing = false; state.prevMouse = null; });

  const draw = (from, to) => {
    const l = getLayer(); if (!l) return; const lctx = l.canvas.getContext('2d');
    lctx.save(); 
    lctx.lineWidth = state.brushSize; lctx.lineCap = 'round'; lctx.lineJoin = 'round';
    
    if (state.tool === 'eraser') {
      lctx.globalCompositeOperation = 'destination-out'; lctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      lctx.globalCompositeOperation = 'source-over'; lctx.strokeStyle = state.color;
      if (state.brushType === 'neon') { lctx.shadowColor = state.color; lctx.shadowBlur = 15; }
      if (state.brushType === 'marker') { lctx.globalAlpha = 0.5; }
    }
    
    if (state.brushType === 'pixel' && state.tool !== 'eraser') { 
      lctx.fillStyle = state.color; 
      lctx.fillRect(to.x, to.y, state.brushSize, state.brushSize); 
    } else { 
      lctx.beginPath(); lctx.moveTo(from.x, from.y); lctx.lineTo(to.x, to.y); lctx.stroke(); 
    }
    lctx.restore();
    render();
  };

  // ЗАЛИВКА
  const floodFill = (layer, sx, sy, hex) => {
    const c = layer.canvas.getContext('2d');
    if (sx<0||sy<0||sx>=cv.width||sy>=cv.height) return;
    const img = c.getImageData(0,0,cv.width,cv.height);
    const d = img.data;
    const i0 = (sy*cv.width+sx)*4;
    const tr=d[i0],tg=d[i0+1],tb=d[i0+2],ta=d[i0+3];
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const match = i => Math.abs(d[i]-tr)<32 && Math.abs(d[i+1]-tg)<32 && Math.abs(d[i+2]-tb)<32 && Math.abs(d[i+3]-ta)<32;
    const stack = [[sx,sy]]; const visited = new Uint8Array(cv.width*cv.height);
    while (stack.length) {
      const [x,y] = stack.pop();
      if (x<0||y<0||x>=cv.width||y>=cv.height) continue;
      const vi = y*cv.width+x;
      if (visited[vi]) continue;
      visited[vi]=1;
      const i = vi*4;
      if (!match(i)) continue;
      d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    c.putImageData(img,0,0);
  };

  // ИНТЕРФЕЙС СЛОЕВ
  const updateLayersUI = () => {
    const list = document.getElementById('layersList'); list.innerHTML = '';
    [...state.layers].reverse().forEach(l => {
      const row = document.createElement('div'); row.className = 'layer' + (l.id===state.activeId?' selected':'');
      row.innerHTML = `<span style="flex:1">${l.name}</span>`;
      row.onclick = () => { state.activeId = l.id; updateLayersUI(); }; list.appendChild(row);
    });
  };

  // СОЗДАНИЕ НОВОГО ХОЛСТА
  const createNewCanvas = (w, h) => {
    cv.width = w; cv.height = h; document.getElementById('sizeLabel').textContent = w + ' × ' + h;
    const bg = mkLayer('Фон', w, h); state.layers = [bg]; state.activeId = bg.id;
    document.getElementById('newOverlay').style.display = 'none';
    updateLayersUI(); render();
  };
  
  document.getElementById('customCreate').onclick = () => { const w = +document.getElementById('customW').value, h = +document.getElementById('customH').value; if (w>0 && h>0) createNewCanvas(w,h); };
  document.getElementById('newBtn').onclick = () => document.getElementById('newOverlay').style.display = 'grid';
  document.getElementById('presets').innerHTML = '';
  [{name:"Full HD", w:1920, h:1080},{name:"HD", w:1280, h:720},{name:"Квадрат", w:1080, h:1080}].forEach(p => { const b = document.createElement('button'); b.className = 'preset'; b.innerHTML = `<b>${p.name}</b><span>${p.w} × ${p.h}</span>`; b.onclick = () => createNewCanvas(p.w, p.h); document.getElementById('presets').appendChild(b); });

  document.getElementById('addLayer').onclick = () => { const l = mkLayer('Слой ' + (state.layers.length+1), cv.width, cv.height); state.layers.push(l); state.activeId = l.id; updateLayersUI(); render(); };
  document.getElementById('exportBtn').onclick = () => { const a = document.createElement('a'); a.download = 'fusion.png'; a.href = cv.toDataURL('image/png'); a.click(); };

  // НАСТРОЙКИ
  document.getElementById('brushRange').oninput = (e) => { state.brushSize = +e.target.value; document.getElementById('brushNum').value = e.target.value; };
  document.getElementById('brushNum').oninput = (e) => { state.brushSize = +e.target.value; document.getElementById('brushRange').value = e.target.value; };
  document.getElementById('brushType').onchange = (e) => { state.brushType = e.target.value; };
  document.getElementById('opacityRange').oninput = (e) => { const l = getLayer(); if(l){ l.opacity = +e.target.value / 100; document.getElementById('opacityNum').value = e.target.value; render(); } };
  document.getElementById('opacityNum').oninput = (e) => { const l = getLayer(); if(l){ l.opacity = +e.target.value / 100; document.getElementById('opacityRange').value = e.target.value; render(); } };

  // ПАЛИТРА
  document.getElementById('colorPicker').oninput = (e) => { state.color = e.target.value; document.getElementById('hexLabel').textContent = state.color.toUpperCase(); };
  document.getElementById('openPaletteBtn').onclick = () => { document.getElementById('paletteOverlay').style.display = 'grid'; };
  document.getElementById('paletteDone').onclick = () => { document.getElementById('paletteOverlay').style.display = 'none'; };
  
  const wheel = document.getElementById('wheel');
  wheel.addEventListener('click', (e) => {
    const r = wheel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.min(Math.hypot(dx,dy), r.width/2);
    const angle = (Math.atan2(dy,dx)*180/Math.PI + 90 + 360) % 360;
    const s = dist / (r.width/2);
    const c = 1; const x = c*(1-Math.abs((angle/60)%2-1)); const m = 0;
    let r2=0,g2=0,b2=0;
    if (angle<60)[r2,g2,b2]=[c,x,0]; else if (angle<120)[r2,g2,b2]=[x,c,0];
    else if (angle<180)[r2,g2,b2]=[0,c,x]; else if (angle<240)[r2,g2,b2]=[0,x,c];
    else if (angle<300)[r2,g2,b2]=[x,0,c]; else [r2,g2,b2]=[c,0,x];
    const blend = (val) => Math.round((val*s + (1-s))*255);
    state.color = '#' + [blend(r2),blend(g2),blend(b2)].map(v => v.toString(16).padStart(2,'0')).join('');
    document.getElementById('colorPicker').value = state.color;
    document.getElementById('hexLabel').textContent = state.color.toUpperCase();
    document.getElementById('wheelMarker').style.left = (50 + Math.cos((angle-90)*Math.PI/180)*s*50) + '%';
    document.getElementById('wheelMarker').style.top = (50 + Math.sin((angle-90)*Math.PI/180)*s*50) + '%';
    document.getElementById('wheelMarker').style.background = state.color;
  });

  // ЗУМ
  stage.addEventListener('wheel', (e) => { 
    if (e.ctrlKey) {
      e.preventDefault(); 
      state.zoom = Math.max(0.1, Math.min(20, state.zoom * (e.deltaY > 0 ? 0.9 : 1.1))); 
      document.getElementById('canvasFrame').style.transform = `scale(${state.zoom})`; 
      document.getElementById('zoomLabel').textContent = Math.round(state.zoom * 100) + '%'; 
    }
  }, { passive: false });

  // ТУЛБАР
  const buildToolbar = () => {
    const tb = document.getElementById('toolbar'); tb.innerHTML = '';
    [{id:'brush', label:'Кисть', icon:'🖌'}, {id:'eraser', label:'Ластик', icon:'⌫'}, {id:'fill', label:'Заливка', icon:'🪣'}, {id:'picker', label:'Пипетка', icon:'💧'}].forEach(t => {
      const b = document.createElement('button'); b.className = 'tool' + (state.tool === t.id ? ' active' : ''); b.textContent = t.icon;
      b.title = t.label;
      b.onclick = () => { state.tool = t.id; buildToolbar(); document.getElementById('toolLabel').textContent = t.label; }; tb.appendChild(b);
    });
  };

  // СТАРТ
  createNewCanvas(960, 540); 
  buildToolbar();
})();
</script>
</body>
</html>
